<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passo 2: Modelos de Relevo e Lâminas de Corte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Cabeçalho -->
    <header class="no-print text-center py-2 border-b border-slate-800">
      <div class="flex items-center justify-center gap-2 mb-1">
        <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 uppercase">
          Fase 2 da Sequência Didática
        </span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Seleção de Terreno & Fatiamento</h1>
      <p class="text-sm text-slate-400 mt-1">Escolha a estrutura geomorfológica e extraia as lâminas para decalque no gesso</p>
    </header>

    <!-- Grid Principal: Seletor e Inspetor -->
    <div class="no-print grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Coluna da Esquerda: Catálogo de Modelos (4 cols) -->
      <section class="lg:col-span-5 space-y-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Modelos Disponíveis</h2>
        <div id="lista-modelos" class="space-y-3">
          <!-- Gerado dinamicamente via JS -->
        </div>
      </section>

      <!-- Coluna da Direita: Inspetor de Lâminas e Vetorização (7 cols) -->
      <section class="lg:col-span-7 bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl flex flex-col justify-between">
        <div>
          <div class="flex items-start justify-between border-b border-slate-700/80 pb-3 mb-4">
            <div>
              <h3 id="detalhe-nome" class="text-lg font-bold text-white">Nome do Relevo</h3>
              <p id="detalhe-desc" class="text-xs text-slate-400 mt-0.5">Descrição geomorfológica</p>
            </div>
            <span id="detalhe-cotas" class="text-xs font-mono font-bold bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700 text-amber-400">
              0m - 0m
            </span>
          </div>

          <!-- Seletor de Lâmina Ativa -->
          <div class="mb-4">
            <label class="block text-xs font-semibold text-slate-300 mb-2">Visualização da Curva de Nível:</label>
            <div id="botoes-camadas" class="flex flex-wrap gap-1.5">
              <!-- Botões das camadas gerados aqui -->
            </div>
          </div>

          <!-- Canvas / Área de Pré-Visualização SVG -->
          <div class="relative aspect-square max-w-[340px] mx-auto bg-slate-950 rounded-xl border border-slate-700/80 flex items-center justify-center p-4 overflow-hidden shadow-inner">
            <svg id="svg-preview" viewBox="0 0 200 200" class="w-full h-full transition-all duration-300">
              <!-- Traçados injetados via JS -->
            </svg>
            <div id="legenda-camada" class="absolute bottom-2 left-2 bg-slate-900/90 backdrop-blur px-2.5 py-1 rounded text-[11px] font-mono text-emerald-300 border border-slate-700">
              Exibindo: Todas as Camadas
            </div>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="mt-6 pt-4 border-t border-slate-700/80 flex flex-col sm:flex-row gap-3">
          <button onclick="window.print()" class="flex-1 py-2.5 px-4 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-sm transition active:scale-95 flex items-center justify-center gap-2 shadow">
            <span>🖨️</span> Gerar Gabarito para Impressão (A4)
          </button>
        </div>
      </section>

    </div>

    <!-- ÁREA DE IMPRESSÃO (Oculta na tela, renderizada apenas ao imprimir/PDF) -->
    <div id="area-impressao" class="print-only hidden p-4 text-black bg-white">
      <!-- Gerado dinamicamente para cada lâmina física -->
    </div>

  </div>

  <script>
    // --- BANCO DIDÁTICO DE RELEVOS COM CURVAS VETORIZADAS (SVG PATHS) ---
    const modelosRelevo = [
      {
        id: 'inselberg',
        nome: 'Inselberg / Morro Testemunha',
        tipo: 'Relevo Residual Cristalino',
        desc: 'Elevação isolada com declividade acentuada e topos arredondados.',
        cotas: '100m a 400m',
        equidistancia: '100m',
        camadas: [
          { cota: '100m (Base)', path: 'M 30,100 C 30,40 60,25 100,25 C 145,25 170,45 170,100 C 170,155 145,175 100,175 C 55,175 30,155 30,100 Z', cor: '#15803d' },
          { cota: '200m', path: 'M 50,100 C 50,55 75,45 100,45 C 130,45 150,60 150,100 C 150,140 130,155 100,155 C 70,155 50,140 50,100 Z', cor: '#ca8a04' },
          { cota: '300m', path: 'M 70,100 C 70,70 85,65 100,65 C 118,65 130,75 130,100 C 130,125 118,135 100,135 C 82,135 70,125 70,100 Z', cor: '#d97706' },
          { cota: '400m (Cume)', path: 'M 88,100 C 88,85 92,80 100,80 C 108,80 112,85 112,100 C 112,112 108,118 100,118 C 92,118 88,112 88,100 Z', cor: '#b45309' }
        ]
      },
      {
        id: 'vale',
        nome: 'Vale Fluvial Encaixado',
        tipo: 'Morfologia Fluvial',
        desc: 'Curvas em formato de "V" cujos vértices apontam para montante (nascente).',
        cotas: '50m a 200m',
        equidistancia: '50m',
        camadas: [
          { cota: '200m (Interflúvio)', path: 'M 20,20 L 180,20 L 180,70 C 140,80 115,120 100,160 C 85,120 60,80 20,70 Z', cor: '#d97706' },
          { cota: '150m (Média Vertente)', path: 'M 20,20 L 180,20 L 180,50 C 140,60 115,100 100,140 C 85,100 60,60 20,50 Z', cor: '#ca8a04' },
          { cota: '100m (Baixa Vertente)', path: 'M 20,20 L 180,20 L 180,35 C 140,45 115,80 100,120 C 85,80 60,45 20,35 Z', cor: '#65a30d' },
          { cota: '50m (Talvegue/Fundo)', path: 'M 20,20 L 180,20 L 180,25 C 130,30 110,50 100,90 C 90,50 70,30 20,25 Z', cor: '#0284c7' }
        ]
      },
      {
        id: 'chapada',
        nome: 'Planalto Tabular / Chapada',
        tipo: 'Relevo Sedimentar',
        desc: 'Topo plano extenso delimitado por escarpas com curvas de nível muito próximas.',
        cotas: '200m a 600m',
        equidistancia: '200m',
        camadas: [
          { cota: '200m (Pé da Escarpa)', path: 'M 25,25 L 175,25 L 175,175 L 25,175 Z', cor: '#15803d' },
          { cota: '400m (Face Escarpada)', path: 'M 35,35 L 165,35 L 165,165 L 35,165 Z', cor: '#ca8a04' },
          { cota: '600m (Superfície Tabular)', path: 'M 50,50 L 150,50 L 150,150 L 50,150 Z', cor: '#b45309' }
        ]
      }
    ];

    let modeloAtual = modelosRelevo[0];
    let camadaVisualizada = 'todas'; // 'todas' ou índice numérico

    const listaModelosEl = document.getElementById('lista-modelos');
    const detalheNomeEl = document.getElementById('detalhe-nome');
    const detalheDescEl = document.getElementById('detalhe-desc');
    const detalheCotasEl = document.getElementById('detalhe-cotas');
    const botoesCamadasEl = document.getElementById('botoes-camadas');
    const svgPreviewEl = document.getElementById('svg-preview');
    const legendaCamadaEl = document.getElementById('legenda-camada');
    const areaImpressaoEl = document.getElementById('area-impressao');

    // Renderiza lista lateral de modelos
    function carregarMenuModelos() {
      listaModelosEl.innerHTML = '';
      modelosRelevo.forEach((mod) => {
        const ativo = mod.id === modeloAtual.id;
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border cursor-pointer transition ${
          ativo 
            ? 'bg-slate-800 border-emerald-500 shadow-md ring-1 ring-emerald-500/50' 
            : 'bg-slate-800/60 border-slate-700 hover:border-slate-600'
        }`;
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-bold ${ativo ? 'text-emerald-400' : 'text-white'}">${mod.nome}</h4>
            <span class="text-[10px] uppercase font-mono px-1.5 py-0.5 rounded bg-slate-900 text-slate-400">${mod.camadas.length} níveis</span>
          </div>
          <p class="text-xs text-slate-400 mt-1 line-clamp-1">${mod.desc}</p>
        `;
        card.onclick = () => selecionarModelo(mod.id);
        listaModelosEl.appendChild(card);
      });
    }

    function selecionarModelo(id) {
      modeloAtual = modelosRelevo.find(m => m.id === id);
      camadaVisualizada = 'todas';
      atualizarPainelDetalhes();
      carregarMenuModelos();
    }

    // Atualiza preview SVG e seletores de camada
    function atualizarPainelDetalhes() {
      detalheNomeEl.textContent = modeloAtual.nome;
      detalheDescEl.textContent = `${modeloAtual.tipo} • ${modeloAtual.desc}`;
      detalheCotasEl.textContent = `${modeloAtual.cotas} (Δh = ${modeloAtual.equidistancia})`;

      // Cria botões de filtro de camada
      botoesCamadasEl.innerHTML = '';
      
      const btnTodas = document.createElement('button');
      btnTodas.className = `px-2.5 py-1 rounded text-xs font-semibold transition ${
        camadaVisualizada === 'todas' 
          ? 'bg-emerald-500 text-slate-950 font-bold' 
          : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
      }`;
      btnTodas.textContent = 'Todas';
      btnTodas.onclick = () => { camadaVisualizada = 'todas'; renderizarSVG(); };
      botoesCamadasEl.appendChild(btnTodas);

      modeloAtual.camadas.forEach((cam, idx) => {
        const btn = document.createElement('button');
        btn.className = `px-2.5 py-1 rounded text-xs font-semibold transition ${
          camadaVisualizada === idx 
            ? 'bg-emerald-500 text-slate-950 font-bold' 
            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
        }`;
        btn.textContent = `Lâmina ${idx + 1} (${cam.cota})`;
        btn.onclick = () => { camadaVisualizada = idx; renderizarSVG(); };
        botoesCamadasEl.appendChild(btn);
      });

      renderizarSVG();
      gerarAreaImpressao();
    }

    function renderizarSVG() {
      svgPreviewEl.innerHTML = '';

      if (camadaVisualizada === 'todas') {
        legendaCamadaEl.textContent = 'Exibindo: Todas as Camadas Sobrepostas';
        modeloAtual.camadas.forEach((cam) => {
          const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          pathEl.setAttribute('d', cam.path);
          pathEl.setAttribute('fill', cam.cor);
          pathEl.setAttribute('fill-opacity', '0.45');
          pathEl.setAttribute('stroke', '#ffffff');
          pathEl.setAttribute('stroke-width', '1.5');
          svgPreviewEl.appendChild(pathEl);
        });
      } else {
        const cam = modeloAtual.camadas[camadaVisualizada];
        legendaCamadaEl.textContent = `Lâmina ${camadaVisualizada + 1}: Cota ${cam.cota}`;

        const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathEl.setAttribute('d', cam.path);
        pathEl.setAttribute('fill', 'none');
        pathEl.setAttribute('stroke', '#34d399');
        pathEl.setAttribute('stroke-width', '2.5');
        pathEl.setAttribute('stroke-dasharray', '3,3');
        svgPreviewEl.appendChild(pathEl);
      }

      // Moldura guia 20x20 cm proporcional
      const rectMoldura = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rectMoldura.setAttribute('x', '2');
      rectMoldura.setAttribute('y', '2');
      rectMoldura.setAttribute('width', '196');
      rectMoldura.setAttribute('height', '196');
      rectMoldura.setAttribute('fill', 'none');
      rectMoldura.setAttribute('stroke', '#475569');
      rectMoldura.setAttribute('stroke-width', '1');
      svgPreviewEl.appendChild(rectMoldura);
    }

    // Gera o gabarito de impressão em folha física (1 página para o mapa geral + 1 por lâmina)
    function gerarAreaImpressao() {
      areaImpressaoEl.innerHTML = `
        <div class="text-center mb-6">
          <h1 class="text-xl font-black uppercase">Gabarito de Fatiamento: ${modeloAtual.nome}</h1>
          <p class="text-xs text-gray-600">Cartografia no Gesso • Use este material com papel carbono sobre a placa de gesso.</p>
        </div>
      `;

      modeloAtual.camadas.forEach((cam, idx) => {
        const bloco = document.createElement('div');
        bloco.className = idx > 0 ? 'page-break mt-6' : '';
        bloco.innerHTML = `
          <div class="border-2 border-black p-4 rounded max-w-[500px] mx-auto text-center">
            <div class="flex justify-between items-center text-xs font-bold border-b pb-2 mb-4">
              <span>LÂMINA ${idx + 1} DE ${modeloAtual.camadas.length}</span>
              <span>COTA ALTIMÉTRICA: ${cam.cota}</span>
            </div>
            <svg viewBox="0 0 200 200" class="w-72 h-72 mx-auto my-4 border border-dashed border-gray-400">
              <path d="${cam.path}" fill="none" stroke="black" stroke-width="2" />
            </svg>
            <p class="text-[10px] text-gray-500 mt-2">
              Alinhe as bordas externas da folha com a fôrma de gesso de 20x20 cm antes de decalcar.
            </p>
          </div>
        `;
        areaImpressaoEl.appendChild(bloco);
      });
    }

    // Inicialização
    carregarMenuModelos();
    atualizarPainelDetalhes();
  </script>
</body>
</html>
